<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Adni81</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="login-container" id="loginPage">
    <div class="login-box">
      <div class="login-logo">
        <h1>🎯 ADNI81</h1>
        <p>Performance Dashboard Admin</p>
      </div>
      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Masukkan username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Masukkan password" required>
        </div>
        <button type="submit" class="btn-login">Masuk Dashboard</button>
        <div id="loginError" class="error-message" style="display:none;"></div>
      </form>
      <div class="login-footer">
        <small>© 2026 Adni81 Performance System</small>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      
      // Ganti dengan username dan password pilihan Anda
      const VALID_USERNAME = 'admin';
      const VALID_PASSWORD = 'adni812026';
      
      if (username === VALID_USERNAME && password === VALID_PASSWORD) {
        localStorage.setItem('adni81_auth', 'true');
        window.location.href = 'dashboard.html';
      } else {
        errorEl.style.display = 'block';
        errorEl.textContent = '❌ Username atau password salah!';
        setTimeout(() => { errorEl.style.display = 'none'; }, 3000);
      }
    });
  </script>
</body>
</html>
